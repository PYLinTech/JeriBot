<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>杰睿 JeriBot</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/remixicon.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="app" class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebarHead">
        <button id="toggleSidebar" class="iconButton" type="button" aria-label="折叠侧边栏" title="折叠侧边栏">
          <img class="brandLogo" src="/favicon.ico" alt="" aria-hidden="true">
        </button>
        <span class="brandText">杰睿 JeriBot</span>
      </div>
      <nav class="sidebarBody" aria-label="导航">
        <div class="sidebarActions">
          <button class="actionButton" type="button"><i class="ri-add-large-line actionIcon" aria-hidden="true"></i><span class="actionLabel">新建会话</span></button>
          <button class="actionButton actionNewGroup" type="button"><i class="ri-folder-add-line actionIcon" aria-hidden="true"></i><span class="actionLabel">新建分组</span></button>
        </div>
        <div id="chatList" class="chatList">
          <div class="groupSection">
            <div class="groupHeader">
              <i class="ri-folder-line groupIcon" aria-hidden="true"></i>
              <span class="groupName">默认分组</span>
            </div>
          </div>
        </div>
      </nav>
      <div class="sidebarFoot">
        <button class="navButton" type="button" data-nav="personality"><i class="ri-user-smile-line navIcon" aria-hidden="true"></i><span class="navLabel">人格</span></button>
        <button class="navButton" type="button" data-nav="skills"><i class="ri-magic-line navIcon" aria-hidden="true"></i><span class="navLabel">技能</span></button>
        <button class="navButton" type="button" data-nav="memory"><i class="ri-brain-line navIcon" aria-hidden="true"></i><span class="navLabel">记忆</span></button>
        <button class="navButton" type="button" data-nav="tools"><i class="ri-tools-line navIcon" aria-hidden="true"></i><span class="navLabel">工具</span></button>
        <button class="navButton" type="button" data-nav="store"><i class="ri-shopping-bag-3-line navIcon" aria-hidden="true"></i><span class="navLabel">商店</span></button>
        <button class="navButton" type="button" data-nav="settings"><i class="ri-settings-3-line navIcon" aria-hidden="true"></i><span class="navLabel">设置</span></button>
      </div>
    </aside>
    <div id="overlay" class="overlay"></div>
    <section id="mainView" class="mainPane active">
      <header class="mainHeader">
        <button class="mobileMenuBtn" type="button" aria-label="打开侧边栏" title="打开侧边栏">
          <img class="mobileMenuLogo" src="/favicon.ico" alt="" aria-hidden="true">
        </button>
        <h1>杰睿 JeriBot</h1>
      </header>
    </section>
    <section id="storeView" class="mainPane storePane">
      <header class="mainHeader storeHeader">
        <button class="mobileMenuBtn" type="button" aria-label="打开侧边栏" title="打开侧边栏">
          <img class="mobileMenuLogo" src="/favicon.ico" alt="" aria-hidden="true">
        </button>
        <div class="storeTitleBlock">
          <h1>商店</h1>
        </div>
        <div class="storeHeaderActions">
          <div id="storeSourcePicker" class="storeSourcePicker">
            <button id="storeSourceButton" class="storeSourceButton" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span id="storeSourceButtonText">国内源</span>
              <i class="ri-arrow-down-s-line" aria-hidden="true"></i>
            </button>
            <div id="storeSourceMenu" class="storeSourceMenu hidden" role="listbox"></div>
          </div>
          <button id="storeEditCustomSourceBtn" class="storeIconButton hidden" type="button" title="编辑自定义源" aria-label="编辑自定义源"><i class="ri-edit-line" aria-hidden="true"></i></button>
        </div>
      </header>
      <div class="storeShell">
        <div class="storeTopbar">
          <div class="storeTabs" role="tablist" aria-label="商店分类">
            <button class="storeTab active" type="button" data-store-cat="personality"><i class="ri-user-smile-line" aria-hidden="true"></i><span>人格</span></button>
            <button class="storeTab" type="button" data-store-cat="skill"><i class="ri-magic-line" aria-hidden="true"></i><span>技能</span></button>
            <button class="storeTab" type="button" data-store-cat="memory"><i class="ri-brain-line" aria-hidden="true"></i><span>记忆</span></button>
            <button class="storeTab" type="button" data-store-cat="tool"><i class="ri-tools-line" aria-hidden="true"></i><span>工具</span></button>
            <button class="storeTab" type="button" data-store-cat="local"><i class="ri-archive-line" aria-hidden="true"></i><span>本地</span></button>
          </div>
          <div class="storeSearchBox">
            <i class="ri-search-line" aria-hidden="true"></i>
            <input id="storeSearchInput" type="search" placeholder="搜索名称、作者或 ID" autocomplete="off">
          </div>
        </div>
        <p id="storeMessage" class="storeMessage" role="status"></p>
        <div id="storeRemotePane" class="storeRemotePane">
          <div id="storeStats" class="storeStats"></div>
          <div id="storeItemList" class="storeGrid"></div>
        </div>
        <div id="storeLocalPane" class="storeLocalPane hidden">
          <input id="storeZipInput" type="file" accept=".zip,application/zip" hidden>
          <button id="storeZipDropZone" class="storeDropZone" type="button">
            <i class="ri-upload-cloud-2-line" aria-hidden="true"></i>
            <strong>选择或拖入安装包</strong>
          </button>
          <article id="storeLocalPackCard" class="storeLocalPreview hidden">
            <div class="storeLocalPreviewHead">
              <div class="storeLocalPreviewTitle">
                <img id="storeLocalPackIcon" class="storePackageImage hidden" alt="">
                <strong id="storeLocalPackName">-</strong>
                <span id="storeLocalPackFile">-</span>
              </div>
              <span id="storeLocalPackVersion" class="storeBadge">v-</span>
            </div>
            <div class="storeLocalPreviewMeta">
              <span><b>类型</b><em id="storeLocalPackType">-</em></span>
              <span><b>ID</b><em id="storeLocalPackId">-</em></span>
              <span><b>上传者</b><em id="storeLocalPackUploader">-</em></span>
            </div>
            <p id="storeLocalPackDesc">暂时没有说明</p>
            <button id="installLocalPackBtn" class="storePrimaryButton" type="button" disabled><i class="ri-download-cloud-2-line" aria-hidden="true"></i><span>安装本地包</span></button>
          </article>
        </div>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
